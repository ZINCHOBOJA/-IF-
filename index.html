const TYPE_NAMES=["主人公♂ パワー","主人公♂ スピード","主人公♂ バランス/ラッキー","主人公♀ パワー(추정)","主人公♀ スピード(추정)","主人公♀ バランス/ラッキー(추정)","レイコ","ユミ","チャーリー","アキラ"];
function D(id){return DATA.demons[id];}
function predict(type,cur,gdp,rareFlag,savedCur){
  const L=DATA.lists[type];
  let eff=cur;
  if(rareFlag) eff=(savedCur===undefined||savedCur===null)?0xFFFF:savedCur;
  const baseCur=(eff===0xFFFF||!D(eff))?null:D(eff).base;
  const half=baseCur===null?0xFF:Math.floor(baseCur/2);
  const thr=gdp+half;
  let sel=-1;
  for(let i=0;i<L.length;i++){
    const w=L[i];
    if(w===0xFFFF){sel=i-1;break;}
    if(w===0x7FFF||w>=0x200)continue;
    if(D(w).base<=thr){sel=i;break;}
  }
  let nw=L[sel];
  if(nw===eff){ if(L[sel+1]!==0xFFFF) nw=L[sel+1]; }
  const idx=w=>{let y=0;for(;y<32&&y<L.length;y++){if(L[y]===w)return y;}return 32;};
  const oldIdx=eff===0xFFFF?0xFFFF:idx(eff);
  const newIdx=idx(nw);
  if(!(oldIdx>=newIdx)){ let n=L[oldIdx+1]; if(n===0xFFFF) n=L[oldIdx]; nw=n; }
  const ranks=[];
  for(const w of L){ if(w===0xFFFF)break; if(w===0x7FFF||w>=0x200)continue;
    ranks.push({id:w,need:Math.max(0,D(w).base-half),cur:w===eff,next:w===nw}); }
  return {eff,next:nw,thr,half,ranks,up:(eff!==0xFFFF&&idx(nw)<oldIdx)||(eff===0xFFFF),down:eff!==0xFFFF&&idx(nw)>oldIdx};
}
function u16(b,o){return b[o]|(b[o+1]<<8);}
function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16))+b[o+3]*16777216;}
function readChar(b,o){
  const t=b[o+0x59];
  return {type:t&0x7F,rare:!!(t&0x80),gdp:u32(b,o+0x5A),cur:u16(b,o+0x5E),lv:b[o+0x0A]};
}
function validChar(c){return c.type<10&&(c.cur===0xFFFF||(c.cur<0x200&&D(c.cur)));}
async function inflate(bytes,fmt){
  const ds=new DecompressionStream(fmt);
  const s=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unwrap(b){
  if(b[0]===0x1f&&b[1]===0x8b) return unwrap(await inflate(b,'gzip'));
  const head=String.fromCharCode(...b.slice(0,8));
  if(head.startsWith('#RZIPv')){
    const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
    let p=8+4+8; const parts=[];
    while(p+4<=b.length){const n=dv.getUint32(p,true);p+=4;if(!n)break;parts.push(await inflate(b.slice(p,p+n),'deflate'));p+=n;}
    let tot=parts.reduce((s,x)=>s+x.length,0),out=new Uint8Array(tot),q=0;for(const x of parts){out.set(x,q);q+=x.length;}
    return unwrap(out);
  }
  return b;
}
function findTag(b,tag){
  const t=[...tag].map(c=>c.charCodeAt(0));
  for(let i=0;i+11<b.length;i++){
    if(b[i]===t[0]&&b[i+1]===t[1]&&b[i+2]===t[2]&&b[i+3]===0x3A&&b[i+10]===0x3A){
      const n=parseInt(String.fromCharCode(...b.slice(i+4,i+10)),10);
      if(n>0) return b.slice(i+11,i+11+n);
    }
  }
  return null;
}
async function analyze(raw){
  const b=await unwrap(raw);
  let ram=findTag(b,'RAM');
  if(!ram&&b.length===131072) ram=b;
  const res={kind:'',slots:[]};
  if(ram){
    res.kind='state';
    const h=readChar(ram,0x1000),p=readChar(ram,0x1060);
    res.moon=ram[0x030F];
    res.slots.push({label:'세이브 스테이트',chars:[{who:'주인공',c:h,saved:u16(ram,0x0373)},{who:'파트너',c:p,saved:u16(ram,0x0375)}]});
    return res;
  }
  res.kind='sram';
  const sig=[0x80,0x94,0xa8,0xbc];let k=0;
  for(let o=0;o+0xC0<=b.length;o++){
    let ok=true;for(let j=0;j<4;j++){if(b[o+0x32+j]!==sig[j]||b[o+0x92+j]!==sig[j]){ok=false;break;}}
    if(!ok)continue;
    const h=readChar(b,o),p=readChar(b,o+0x60);
    if(!validChar(h))continue;
    k++;res.slots.push({label:'세이브 데이터 '+k+' (offset 0x'+o.toString(16)+')',chars:[{who:'주인공',c:h},{who:'파트너',c:p}]});
    o+=0xBF;
  }
  return res;
}


const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ko-KR');
function dn(id){if(id===0xFFFF)return '없음';const d=D(id);return d?d.n:'?('+id+')';}
function mag(id){const d=D(id);return d&&d.mag.length?d.mag.join('・'):'—';}
function card(ch,moon){
  const c=ch.c;
  if(!validChar(c)) return `<section class="card"><h3>${ch.who}</h3><p class="muted">데이터 없음 (아직 동료가 아니거나 빈 슬롯)</p></section>`;
  const p=predict(c.type,c.cur,c.gdp,c.rare,ch.saved);
  const partner=c.type>=6;
  const dir=p.eff===0xFFFF?'<span class="tag up">첫 가디언</span>':p.up?'<span class="tag up">▲ 상승</span>':p.down?'<span class="tag down">▼ 1단계 하락</span>':'<span class="tag">유지</span>';
  let rows='';
  let past=p.eff===0xFFFF?false:false;
  for(const r of p.ranks){
    const d=D(r.id);const below=past;if(r.cur)past=true;
    rows+=`<tr class="${r.next?'next':''} ${r.cur?'cur':''}"><td>${d.n}${r.cur?' <b class="mk">현재</b>':''}${r.next?' <b class="mk nx">다음</b>':''}</td><td>${d.lv}</td><td class="num">${below||r.cur?'—':fmt(r.need)}</td>${partner?`<td class="mg">${d.mag.join('・')||'—'}</td>`:''}</tr>`;
  }
  let warn='';
  if(c.gdp>=0x1000000||c.gdp>2000000) warn+=`<p class="warn">GDP 값이 비정상적으로 큽니다 (치트 코드 흔적일 수 있음).</p>`;
  if(c.rare) warn+=`<p class="warn">현재 희소 가디언 상태입니다. ${ch.saved===undefined?'SRAM에는 이전 가디언 정보가 없어 “없음” 기준으로 계산했습니다. 정확히 보려면 세이브 스테이트를 넣어 주세요.':'계산은 희소 가디언 이전의 가디언 기준입니다.'}</p>`;
  if(moon!==undefined && (moon&0xF0)===0x80 && !c.rare) warn+=`<p class="warn">지금 보름달입니다. 이 상태로 죽으면 1/256 확률로 희소 가디언(${[...new Set(DATA.rare.map(dn))].join('・')})이 붙습니다.</p>`;
  return `<section class="card">
  <h3>${ch.who} <small>${TYPE_NAMES[c.type]}</small></h3>
  <div class="grid"><div><span class="k">현재 가디언</span><span class="v">${dn(c.cur)}</span></div>
  <div><span class="k">GDP</span><span class="v">${fmt(c.gdp)}</span></div></div>
  <div class="result"><span class="k">지금 죽으면</span><span class="big">${dn(p.next)}</span> ${dir}
  ${partner?`<div class="mgline">습득 마법: ${mag(p.next)}</div>`:''}</div>
  ${warn}
  <details ${p.ranks.length<25?'':''}><summary>랭크별 필요 GDP 보기</summary>
  <p class="muted">필요 GDP = 그 가디언의 기본 GDP − ⌊현재 가디언 기본 GDP ÷ 2⌋${p.eff===0xFFFF?' (가디언이 없으면 − 255)':''}. 위쪽이 강한 순서입니다. 현재보다 위 랭크 중 GDP가 닿는 가장 강한 것이 붙고, 아무것도 닿지 않으면 한 단계 아래로 내려갑니다.</p>
  <table><thead><tr><th>가디언</th><th>Lv</th><th>필요 GDP</th>${partner?'<th>마법</th>':''}</tr></thead><tbody>${rows}</tbody></table></details>
  </section>`;
}
async function onFile(f){
  $('#out').innerHTML='<p class="muted">읽는 중…</p>';
  try{
    const r=await analyze(new Uint8Array(await f.arrayBuffer()));
    if(!r.slots.length){$('#out').innerHTML='<p class="warn">캐릭터 데이터를 찾지 못했습니다. 진·여신전생 if의 .srm 세이브나 snes9x 계열 세이브 스테이트인지 확인해 주세요.</p>';return;}
    let h=`<p class="muted">${f.name} · ${r.kind==='state'?'세이브 스테이트':'SRAM 세이브'}${r.moon!==undefined?' · 월령 '+(r.moon>>4)+'/16':''}</p>`;
    for(const s of r.slots){h+=`<h2>${s.label}</h2>`+s.chars.map(ch=>card(ch,r.moon)).join('');}
    $('#out').innerHTML=h;
  }catch(e){$('#out').innerHTML='<p class="warn">읽기 실패: '+e.message+'</p>';}
}
$('#f').addEventListener('change',e=>{if(e.target.files[0])onFile(e.target.files[0]);});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])onFile(e.dataTransfer.files[0]);});
